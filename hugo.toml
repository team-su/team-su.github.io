baseurl = "https://su-team.cn/"
DefaultContentLanguage = "en"
title = "su-team"
theme = "su-theme"
timeZone = "Asia/Shanghai"
timeout = "60m"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 6
    ordered = false
    startLevel = 1
  [markup.highlight]
    lineNos = false
    codeFences = true
    guessSyntax = false
    style = "github"
    noClasses = false

[Params]
  mainSections = ["post"]
  katex = true
  homeTitle = "su-team"
  homeSubtitle = "United Sudoers"
  homeDescription = "Competition archives, deep-dive writeups, and long-term team memory from Team SU."
  heroSlogans = [
    "一支全年摸鱼，偶尔起飞的佛系 CTF 战队。",
    "flag{we_are_sudoers}",
  ]
  logo = "img/SU.png"
  favicon = "img/SU.png"
  dateFormat = "January 2, 2006"
  commit = false
  rss = false
  showRelatedPosts = false
  selfHosted = true
  readingTime = true
  wordCount = true
  useHLJS = false
  socialShare = false
  delayDisqus = true
  articleEyebrow = "SU TEAM ARCHIVE"
  articleLead = "Writeups, reports, and battle notes from the team."
  footerTagline = "Built for team archives and competition writeups."
  footerSubline = "Minimal noise, high signal, and fast navigation."
  since = 2016

[Params.author]
  name = "SUer"
  website = "https://su-team.cn"
  email = "suers_xctf@126.com"
  github = "team-su"
  ctftime = "https://ctftime.org/team/29641"

disableKinds = ["RSS"]

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  hint = "drawing"
  anchor = "Center"
  [imaging.exif]
    disableLatLong = true

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "**"]

[[module.mounts]]
  source = "content"
  target = "assets/c"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "static"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "! **.gif", "! **.ico", "**"]

[[module.mounts]]
  source = "static"
  target = "assets/s"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "archetypes"
  target = "archetypes"

[[menu.main]]
    name = "Archives"
    url = "page/archives/"
    weight = 1
[[menu.main]]
    name = "Members"
    url = "page/active-members/"
    weight = 2
[[menu.main]]
    name = "Pioneers"
    url = "page/pioneers/"
    weight = 3
[[menu.main]]
    name = "About"
    url = "page/about/"
    weight = 4
[[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 5
