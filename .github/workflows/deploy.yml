name: Deploy Hugo Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.1"
          extended: true

      # 仅 CI 转 webp：rankingImage / alt=排名 为 q100，其余正文图 q80。本地 hugo 不转换。
      # Hugo 按源文件内容 hash 失效，缓存不会陈旧。
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            /tmp/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('hugo.toml', 'layouts/partials/process-image.html', 'layouts/partials/process-image-inner.html', 'layouts/_markup/render-image.html') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - run: hugo --minify --buildFuture --cleanDestinationDir --gc
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
          HUGO_PROCESS_WEBP: "1"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_branch: master
          publish_dir: ./public
          force_orphan: true
          # cname: su-team.cn

      # HK VPS（Caddy）。密钥仓库 Secret：VPS_SSH_KEY
      # 主机信息支持用仓库 Variables 覆盖，默认指向当前 HK VPS。
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST || '191.40.46.42' }}
          VPS_PORT: ${{ vars.VPS_PORT || '25238' }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
          VPS_PATH: ${{ vars.VPS_PATH || '/var/www/su-team/' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'echo "VPS SSH OK"'
          rsync -az --delete --info=stats2 \
            -e "ssh -p $VPS_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15" \
            public/ "$VPS_USER@$VPS_HOST:$VPS_PATH"
