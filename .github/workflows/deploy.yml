name: Deploy Hugo Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      # 缓存 Hugo 图片处理缓存（Hugo 按源文件内容 hash 失效，缓存不会陈旧）
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources
            /tmp/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('hugo.toml', 'assets/**', 'layouts/**', 'themes/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - run: hugo --minify --buildFuture --cleanDestinationDir
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_branch: master
          publish_dir: ./public
          force_orphan: true
          # cname: su-team.cn

      # HK VPS（Caddy）。密钥仓库 Secret：VPS_SSH_KEY
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 25238 -H 156.239.238.130 >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -p 25238 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            public/ root@156.239.238.130:/var/www/su-team/
