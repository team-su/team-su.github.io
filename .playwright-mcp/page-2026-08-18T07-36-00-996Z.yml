              - generic [ref=f21e55]: "prefix = bytes_to_long(b\"flag{\")"
              - generic [ref=f21e57]: PR.<x,y> = PolynomialRing(Zmod(n1))
              - generic [ref=f21e59]: f = (m1[0] - prefix*256^16 + x)^e1 - (m1[1] - y)^e1 - x1[1] + x1[0]
              - generic [ref=f21e61]: res = small_roots(f,bounds=(256^25,256^25))
              - generic [ref=f21e63]: print(res)
              - generic [ref=f21e65]: print(long_to_bytes(int(n1-res[0][0])))
              - generic [ref=f21e68]: "###################################### part2"
              - generic [ref=f21e70]: PR.<x> = PolynomialRing(Zmod(n2))
              - generic [ref=f21e72]: f1 = (m2[0] - x)^e2 - (v2 - x2[0])
              - generic [ref=f21e74]: f2 = (m2[1] - c[1] - x*c[0])^e2 - (v2 - x2[1])
