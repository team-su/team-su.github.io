        - heading "About us" [level=1] [ref=f7e33]
        - paragraph [ref=f7e34]: 一支全年摸鱼，偶尔起飞的佛系 CTF 战队
      - generic [ref=f7e35]:
        - heading "关于我们" [level=2] [ref=f7e36]
        - paragraph [ref=f7e37]: SU创队之始，战队取名SU，一方面代表江苏，另一方面也寓意夺取最高权限，现在我们将成员范围不再仅仅局限于江苏，扩大为全国各地，保留SU队名一方面是希望继续以SU已有的成绩基础上继续创造佳绩，另一方面我们也希望我们不再是只是一支江苏联合战队，更希望是一支全国高校的联合战队，希望能把越来越多的高校联合起来，无论这些高校有没有社团基础，现在的成绩如何，只要同学们对CTF这方面或者不仅是这方面感兴趣，我们都愿意去从各方面去帮助这些同学们在自己的高校建立起相应的社团资源，或者为这些单打独斗的同学提供一个更好的交流环境，为这些苦于没有学习资源却真正想学习的同学提供一个良好的平台，所以我们也更愿意把SU解释为 united sudoers / sudoers of union。总之我们希望能把更多的网络安全爱好者联合起来，构建一支强有力的队伍，一起为共同的目标努力，向着梦想出发。
        - paragraph [ref=f7e38]:
          - text: 有意愿加入我们的小伙伴联系邮箱：
