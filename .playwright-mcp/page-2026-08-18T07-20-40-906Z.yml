          - paragraph [ref=f4e5658]: K0：单线程解释执行 coTex里的 RGBA 字节码维护 mem[32] 和 reg[16]，按 opcode 做立即数赋值、从 WorkTex(u0) 读字节、XOR、8-bit 循环移位、乘法/加法混淆、比较设条件与条件跳转；执行结束后把 reg[0..15] 归一化为 float 写回 WorkTex 的 16×1 像素。
          - paragraph [ref=f4e5659]: K1：每个线程处理一个 i（0..15）：从 WorkTex(u0) 读 work[i]（red*255 取整 &255），计算 ((work[i] + i) & 0xFF)，再从 ciTex(t0) 读 ci[i]（同样取整 &255），若 ci[i] != ((work[i] + i) & 0xFF) 就把 SharedState[0]（u1[0]）写成 1 表示失败；等价通过条件是 work[i] = (ci[i] - i) & 0xFF。
          - paragraph [ref=f4e5660]: K2：典型 tile 渲染/后处理：对输出纹理 u0 的每个像素做边界检查后，按常量缓冲 CB0 计算归一化坐标并做 sincos 旋转/缩放偏移；根据 SharedState[0]（u1[0]）选择采样 t0（状态=0）或 t1（状态=1，否则输出黑），再按 r0.x 做一次向黑/alpha=1 的线性淡出混合，最后写回 u0
