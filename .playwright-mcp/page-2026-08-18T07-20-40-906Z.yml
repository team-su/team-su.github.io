          - paragraph [ref=f4e5762]: 连续逆三轮即可，exp如下：
          - generic [ref=f4e5763]:
            - code [ref=f4e5765]:
              - generic [ref=f4e5766]: "def rol8(x, s): s &= 7; return ((x << s) | (x >> (8 - s))) & 0xFF"
              - generic [ref=f4e5768]: "def ror8(x, s): s &= 7; return ((x >> s) | (x << (8 - s))) & 0xFF"
              - generic [ref=f4e5770]: INV7 = 183
              - generic [ref=f4e5772]: "def Finv(out):"
              - generic [ref=f4e5774]: state = 42
              - generic [ref=f4e5776]: inp = []
              - generic [ref=f4e5778]: "for i, o in enumerate(out):"
              - generic [ref=f4e5780]: w = (o - i) & 0xFF
              - generic [ref=f4e5782]: u = (w * INV7) & 0xFF
              - generic [ref=f4e5784]: v = ror8(u, i)
              - generic [ref=f4e5786]: inp.append(v ^ state)
              - generic [ref=f4e5788]: state = (state + o) & 0xFF
              - generic [ref=f4e5790]: return inp
