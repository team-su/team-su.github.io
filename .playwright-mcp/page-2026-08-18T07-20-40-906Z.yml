          - paragraph [ref=f4e6450]: 对于batch2，利用明文线性仿射得到seed
          - paragraph [ref=f4e6451]: 用题目压缩器 Il1 压缩 ParticlePhysicsSimulator.java
          - paragraph [ref=f4e6452]:
            - text: 用一个 Java wrapper 调
            - code [ref=f4e6453]: i.l.Il1.Il1(byte[])
            - text: ：
          - generic [ref=f4e6454]:
            - code [ref=f4e6456]:
              - generic [ref=f4e6457]: import java.nio.file.*;
              - generic [ref=f4e6459]: import i.l.Il1;
              - generic [ref=f4e6462]: "public class Compress {"
              - generic [ref=f4e6464]: "public static void main(String[] args) throws Exception {"
              - generic [ref=f4e6466]: byte[] in = Files.readAllBytes(Paths.get(args[0]));
              - generic [ref=f4e6468]: byte[] out = Il1.Il1(in);
              - generic [ref=f4e6470]: System.out.write(out);
              - generic [ref=f4e6472]: "}"
              - generic [ref=f4e6474]: "}"
            - button "Copy code" [ref=f4e6476] [cursor=pointer]
          - paragraph [ref=f4e6480]: 编译并运行：
          - generic [ref=f4e6481]:
            - code [ref=f4e6483]:
              - generic [ref=f4e6484]: javac -cp work/recovered_classes Compress.java
              - generic [ref=f4e6486]: java -cp work/recovered_classes:. Compress \
              - generic [ref=f4e6488]: work/unknown_zip/app/src/main/java/com/unknown/ParticlePhysicsSimulator.java \
              - generic [ref=f4e6490]: "> work/out/pps_comp.bin"
            - button "Copy code" [ref=f4e6492] [cursor=pointer]
          - paragraph [ref=f4e6496]: 计算 keystream：K = C XOR P
          - paragraph [ref=f4e6497]: 取 batch2 ciphertext 的前 3577 bytes，和 pps_comp.bin xor：
          - generic [ref=f4e6498]:
            - code [ref=f4e6500]:
              - generic [ref=f4e6501]: from pathlib import Path
              - generic [ref=f4e6504]: C = (Path("work/batches/batch2_cipher.bin").read_bytes())[:3577]
              - generic [ref=f4e6506]: P = Path("work/out/pps_comp.bin").read_bytes()
              - generic [ref=f4e6508]: "K = bytes([a ^ b for a, b in zip(C, P)]) # keystream 前缀"
              - generic [ref=f4e6510]: Path("work/out/ks_prefix.bin").write_bytes(K)
            - button "Copy code" [ref=f4e6512] [cursor=pointer]
          - paragraph [ref=f4e6516]:
            - text: 我们可以用
            - code [ref=f4e6517]: Runner.encrypt(key0, zeros, seed)
            - text: 直接得到
            - code [ref=f4e6518]: K(seed)
            - text: （因为输入全 0，输出就是 keystream）。 而：
          - generic [ref=f4e6519]:
            - code [ref=f4e6521]:
              - generic [ref=f4e6522]: K(s1) XOR K(s2) XOR K(0) == K(s1 XOR s2)
            - button "Copy code" [ref=f4e6524] [cursor=pointer]
          - paragraph [ref=f4e6528]:
            - text: 这说明是仿射线性：
            - code [ref=f4e6529]: K(seed) = K(0) XOR (A * seed_bits)
            - text: 。
          - paragraph [ref=f4e6530]:
            - text: 因此用 64 个 basis seed（
            - code [ref=f4e6531]: 1<<i
            - text: ）采样就能建立线性方程组，做高斯消元解出 seed。
          - generic [ref=f4e6532]:
            - code [ref=f4e6534]:
              - generic [ref=f4e6535]: import subprocess
              - generic [ref=f4e6537]: from pathlib import Path
              - generic [ref=f4e6540]: JAVA_CP = "recovered_classes:."
              - generic [ref=f4e6542]: KEY0 = "key0.b64"
              - generic [ref=f4e6544]: ZEROS64 = "out/zeros64.bin"
              - generic [ref=f4e6546]: OUTTMP = "out/_ks_tmp.bin"
              - generic [ref=f4e6549]: Path(ZEROS64).write_bytes(b"\x00"*64)
              - generic [ref=f4e6552]: "def keystream64(seed_hex: str) -> bytes:"
              - generic [ref=f4e6554]: subprocess.run(
              - generic [ref=f4e6556]: "[\"java\", \"-cp\", JAVA_CP, \"Decrypt\", KEY0, seed_hex, ZEROS64, OUTTMP],"
              - generic [ref=f4e6558]: check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              - generic [ref=f4e6560]: )
              - generic [ref=f4e6562]: return Path(OUTTMP).read_bytes()
              - generic [ref=f4e6565]: "def xor_bytes(a,b): return bytes(x^y for x,y in zip(a,b))"
              - generic [ref=f4e6568]: "def bytes_to_bits_le(b: bytes):"
              - generic [ref=f4e6570]: bits=[]
              - generic [ref=f4e6572]: "for byte in b:"
              - generic [ref=f4e6574]: "for k in range(8):"
              - generic [ref=f4e6576]: "bits.append((byte>>k)&1) # 低位->高位：只要一致即可"
              - generic [ref=f4e6578]: return bits
              - generic [ref=f4e6581]: "def solve_seed_from_keystream(K_obs: bytes, prefix_bytes=16) -> int:"
              - generic [ref=f4e6583]: K0 = keystream64("0000000000000000")[:prefix_bytes]
              - generic [ref=f4e6585]: d = xor_bytes(K_obs[:prefix_bytes], K0)
              - generic [ref=f4e6587]: d_bits = bytes_to_bits_le(d)
              - generic [ref=f4e6589]: n_eq = len(d_bits)
              - generic [ref=f4e6592]: "# columns[i] 是 seed 第 i 位对输出 bits 的贡献"
              - generic [ref=f4e6594]: cols = []
              - generic [ref=f4e6596]: "for i in range(64):"
              - generic [ref=f4e6598]: "Ki = keystream64(f\"{1<<i:016x}\")[:prefix_bytes]"
              - generic [ref=f4e6600]: cols.append(bytes_to_bits_le(xor_bytes(Ki, K0)))
              - generic [ref=f4e6603]: "# 组装为 row 方程：rows[j] 是第 j 条方程的 64-bit 系数"
              - generic [ref=f4e6605]: rows = []
              - generic [ref=f4e6607]: rhs = []
              - generic [ref=f4e6609]: "for j in range(n_eq):"
              - generic [ref=f4e6611]: coeff = 0
              - generic [ref=f4e6613]: "for i in range(64):"
              - generic [ref=f4e6615]: "if cols[i][j]:"
              - generic [ref=f4e6617]: coeff |= (1<<i)
              - generic [ref=f4e6619]: rows.append(coeff)
              - generic [ref=f4e6621]: rhs.append(d_bits[j])
              - generic [ref=f4e6624]: "# GF(2) 高斯消元"
              - generic [ref=f4e6626]: piv = [-1]*64
              - generic [ref=f4e6628]: r = 0
              - generic [ref=f4e6630]: "for c in range(64):"
              - generic [ref=f4e6632]: pivot = None
              - generic [ref=f4e6634]: "for rr in range(r, n_eq):"
              - generic [ref=f4e6636]: "if (rows[rr]>>c)&1:"
              - generic [ref=f4e6638]: pivot = rr
              - generic [ref=f4e6640]: break
              - generic [ref=f4e6642]: "if pivot is None:"
              - generic [ref=f4e6644]: continue
              - generic [ref=f4e6646]: rows[r], rows[pivot] = rows[pivot], rows[r]
              - generic [ref=f4e6648]: rhs[r], rhs[pivot] = rhs[pivot], rhs[r]
              - generic [ref=f4e6650]: piv[c] = r
              - generic [ref=f4e6652]: "for rr in range(n_eq):"
              - generic [ref=f4e6654]: "if rr != r and ((rows[rr]>>c)&1):"
              - generic [ref=f4e6656]: rows[rr] ^= rows[r]
              - generic [ref=f4e6658]: rhs[rr] ^= rhs[r]
              - generic [ref=f4e6660]: r += 1
              - generic [ref=f4e6663]: "# 回代"
              - generic [ref=f4e6665]: x = 0
              - generic [ref=f4e6667]: "for c in range(63, -1, -1):"
              - generic [ref=f4e6669]: pr = piv[c]
              - generic [ref=f4e6671]: "if pr == -1:"
              - generic [ref=f4e6673]: continue
              - generic [ref=f4e6675]: rest = rows[pr] & ~(1<<c)
              - generic [ref=f4e6677]: s = rhs[pr] ^ (bin(rest & x).count("1") & 1)
              - generic [ref=f4e6679]: "if s:"
              - generic [ref=f4e6681]: x |= (1<<c)
              - generic [ref=f4e6683]: return x
              - generic [ref=f4e6686]: "# 观测 keystream：来自 C XOR P"
              - generic [ref=f4e6688]: K_obs = Path("out/ks_prefix.bin").read_bytes()
              - generic [ref=f4e6690]: seed = solve_seed_from_keystream(K_obs, prefix_bytes=16)
              - generic [ref=f4e6692]: "print(\"seed =\", f\"{seed:016x}\")"
            - button "Copy code" [ref=f4e6694] [cursor=pointer]
